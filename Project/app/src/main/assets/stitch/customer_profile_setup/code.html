<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

<title>Set up your profile | WorkConnect</title>

                    "on-primary-container": "#8aa4cf",
                    "error-container": "#ffdad6",
                    "surface-bright": "#faf9fc",
                    "on-tertiary-fixed": "#291800",
                    "tertiary-fixed": "#ffddb2",
                    "primary": "#022448",
                    "on-primary-fixed": "#001c3b",
                    "on-primary-fixed-variant": "#2d486d",
                    "inverse-surface": "#2f3033",

                    "on-secondary": "#ffffff",
                    "surface-container-high": "#e9e7eb",

            "spacing": {

            "fontFamily": {

            },
            "fontSize": {
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #faf9fc;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface-container-low dark:bg-surface-dim shadow-sm flex justify-between items-center w-full px-margin-mobile h-16 z-50 sticky top-0">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="location_on">location_on</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">WorkConnect</h1>
</div>
<div class="flex items-center">
<button class="p-sm rounded-full hover:bg-surface-variant dark:hover:bg-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<main class="max-w-xl mx-auto px-margin-mobile py-lg pb-32">
<div class="mb-lg">
<h2 class="font-headline-lg text-headline-lg text-primary mb-xs">Set up your profile</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Quick and easy!</p>
</div>
<form class="space-y-lg">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center">
<div class="relative group">
<div class="w-32 h-32 rounded-full bg-surface-container-high flex items-center justify-center border-2 border-dashed border-outline-variant overflow-hidden">
<img alt="Profile Placeholder" class="w-full h-full object-cover opacity-20" data-alt="A clean, professional close-up shot of a modern studio environment with soft, high-key lighting. The focus is on a circular, minimalist frame ready for a user profile picture. The background consists of soft neutral tones, reflecting a corporate and trustworthy digital utility aesthetic. The mood is welcoming and professional, using a bright and clean color palette consistent with a modern enterprise application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFqY9MMRRBAM28hQ2GHGq9kMfxJS79jm1yPbNMKi8L3CRTXJVZs_QD05dSP1T0Pd9sxbW5daeJ7TKEi9VprnjSr5RHJ67C091Ol-cu4QF6QJTL37Sa2b5p0Kb60mkCPyWRsaSauqCkX2DVpdpm6VqfPaWOzB8vuVbNPMj57guYXBaVDbycQXZ-bIbF_FqNvHrhvV71k5J-rnUecy2JKZA-Qr4qSuc1yDq4ZgX3S9xCz_YeonW391qgCmwTgfCHaCcA8WhpH0nG5aLs"/>
<div class="absolute inset-0 flex items-center justify-center bg-black/5 group-hover:bg-black/10 transition-colors cursor-pointer">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="add_a_photo">add_a_photo</span>
</div>
</div>
<div class="absolute bottom-0 right-0 bg-secondary text-on-secondary p-xs rounded-full shadow-md">
<span class="material-symbols-outlined text-[18px]" data-icon="edit">edit</span>
</div>
</div>
<p class="font-label-md text-label-md text-outline mt-sm">Upload Profile Photo</p>
</section>
<!-- Identity Section -->
<section class="bg-surface-container-lowest p-md rounded-xl shadow-sm space-y-md border border-outline-variant/30">
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface px-xs">Full Name *</label>
<input class="w-full h-12 px-md rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface transition-all" placeholder="Enter your full name" required="" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface px-xs">Email Address (Optional)</label>
<input class="w-full h-12 px-md rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface transition-all" placeholder="email@example.com" type="email"/>
</div>
</section>
<!-- Address Section -->
<section class="space-y-md">
<div class="flex items-center justify-between mb-sm">
<h3 class="font-headline-sm text-headline-sm text-primary">Address details</h3>
<button class="flex items-center gap-xs text-secondary font-label-lg hover:underline transition-all" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="my_location">my_location</span>
                        Use Current Location
                    </button>
</div>
<div class="bg-surface-container-lowest p-md rounded-xl shadow-sm border border-outline-variant/30 space-y-md">
<div class="grid grid-cols-2 gap-md">
<div class="col-span-2 space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface px-xs">Address Label</label>
<div class="relative">
<select class="w-full h-12 px-md pr-10 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface appearance-none transition-all">
<option>Home</option>
<option>Office</option>
<option>Other</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 pointer-events-none text-outline" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="col-span-2 space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface px-xs">Street / Area</label>
<input class="w-full h-12 px-md rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface transition-all" placeholder="House no, Building, Street" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface px-xs">City</label>
<input class="w-full h-12 px-md rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface transition-all" placeholder="City" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface px-xs">State</label>
<input class="w-full h-12 px-md rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface transition-all" placeholder="State" type="text"/>
</div>
<div class="col-span-2 space-y-xs">
<label class="font-label-lg text-label-lg text-on-surface px-xs">Pincode</label>
<input class="w-full h-12 px-md rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none bg-surface transition-all" placeholder="6-digit code" type="text"/>
</div>
</div>
</div>
</section>
<!-- Footer Action -->
<div class="pt-lg">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-sm flex items-center justify-center gap-sm shadow-lg hover:opacity-90 active:scale-[0.98] transition-all" type="submit">
                    Get Started
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</main>
<!-- BottomNavBar (Suppressed based on "Task-Focused" rule for onboarding/setup) -->
<!-- The BottomNavBar is excluded as this is a focused setup screen (Onboarding context) -->
</body></html>
