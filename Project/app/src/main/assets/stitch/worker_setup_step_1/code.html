<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#c4c6cf",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#edbf7f",
                        "surface-variant": "#e3e2e6",
                        "outline": "#74777f",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#00497e",
                        "surface-dim": "#dad9dd",
                        "surface-container": "#eeedf1",
                        "inverse-primary": "#adc8f5",
                        "on-surface": "#1a1c1e",
                        "background": "#faf9fc",
                        "primary-container": "#1e3a5f",
                        "on-primary-container": "#8aa4cf",
                        "error-container": "#ffdad6",
                        "surface-bright": "#faf9fc",
                        "on-tertiary-fixed": "#291800",
                        "tertiary-fixed": "#ffddb2",
                        "primary": "#022448",
                        "on-primary-fixed": "#001c3b",
                        "primary-fixed": "#d5e3ff",
                        "surface-tint": "#455f87",
                        "secondary-container": "#6fb2fd",
                        "on-surface-variant": "#43474e",
                        "on-secondary-fixed": "#001c37",
                        "on-primary-fixed-variant": "#2d486d",
                        "inverse-surface": "#2f3033",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f4f3f7",
                        "secondary-fixed-dim": "#a0caff",
                        "inverse-on-surface": "#f1f0f4",
                        "surface": "#faf9fc",
                        "primary-fixed-dim": "#adc8f5",
                        "on-tertiary-fixed-variant": "#60410c",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#c69b5f",
                        "tertiary": "#341f00",
                        "on-secondary-container": "#004375",
                        "tertiary-container": "#503300",
                        "on-background": "#1a1c1e",
                        "surface-container-highest": "#e3e2e6",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e9e7eb",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d2e4ff",
                        "secondary": "#0061a5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "md": "16px",
                        "gutter-mobile": "12px",
                        "xl": "32px",
                        "xs": "4px",
                        "lg": "24px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<header class="bg-surface-container-low shadow-sm fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
<span class="font-headline-md text-headline-md font-bold text-primary">WorkConnect</span>
</div>
<button class="hover:bg-surface-variant transition-colors p-2 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="notifications">notifications</span>
</button>
</header>
<main class="flex-grow pt-24 pb-32 px-margin-mobile max-w-lg mx-auto w-full">
<div class="mb-lg">
<div class="flex justify-between items-end mb-sm">
<span class="font-label-lg text-label-lg text-primary font-bold">Step 1 of 4</span>
<span class="font-label-md text-label-md text-on-surface-variant">25% Complete</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary w-1/4 rounded-full"></div>
</div>
</div>
<section class="mb-xl">
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm">Let's set up your profile</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Tell us a bit about yourself to get started with finding local opportunities.</p>
</section>
<form class="space-y-lg">
<div class="flex flex-col items-center mb-xl">
<div class="relative group">
<div class="w-32 h-32 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border-2 border-dashed border-outline-variant">
<span class="material-symbols-outlined text-outline text-5xl" data-icon="person">person</span>
</div>
<button class="absolute bottom-0 right-0 bg-secondary text-on-secondary p-sm rounded-full shadow-lg hover:scale-105 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-lg" data-icon="photo_camera">photo_camera</span>
</button>
</div>
<p class="mt-sm font-label-md text-label-md text-on-surface-variant">Add a professional photo</p>
</div>
<div class="space-y-md">
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface">Full Name <span class="text-error">*</span></label>
<input class="w-full h-12 px-md bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="John Doe" required="" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface">Date of Birth <span class="text-error">*</span></label>
<div class="relative">
<input class="w-full h-12 px-md bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all appearance-none" required="" type="date"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface">Gender <span class="text-error">*</span></label>
<div class="grid grid-cols-3 gap-sm">
<label class="relative flex items-center justify-center h-12 border border-outline-variant rounded-lg cursor-pointer has-[:checked]:bg-primary-fixed has-[:checked]:border-primary transition-all">
<input class="sr-only" name="gender" required="" type="radio" value="male"/>
<span class="font-body-md text-body-md">Male</span>
</label>
<label class="relative flex items-center justify-center h-12 border border-outline-variant rounded-lg cursor-pointer has-[:checked]:bg-primary-fixed has-[:checked]:border-primary transition-all">
<input class="sr-only" name="gender" type="radio" value="female"/>
<span class="font-body-md text-body-md">Female</span>
</label>
<label class="relative flex items-center justify-center h-12 border border-outline-variant rounded-lg cursor-pointer has-[:checked]:bg-primary-fixed has-[:checked]:border-primary transition-all">
<input class="sr-only" name="gender" type="radio" value="other"/>
<span class="font-body-md text-body-md">Other</span>
</label>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between">
<label class="font-label-lg text-label-lg text-on-surface">Email Address</label>
<span class="font-label-md text-label-md text-outline-variant">Optional</span>
</div>
<input class="w-full h-12 px-md bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="john.doe@example.com" type="email"/>
</div>
</div>
</form>
</main>
<footer class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-md flex items-center justify-center z-50">
<div class="max-w-lg w-full">
<button class="w-full bg-primary text-on-primary h-14 rounded-xl font-headline-sm text-headline-sm flex items-center justify-center gap-sm shadow-md active:scale-[0.98] transition-all">
                Next
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
