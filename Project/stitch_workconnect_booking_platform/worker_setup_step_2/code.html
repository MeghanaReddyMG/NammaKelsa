<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#c4c6cf",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#edbf7f",
                        "surface-variant": "#e3e2e6",
                        "outline": "#74777f",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#00497e",
                        "surface-dim": "#dad9dd",
                        "surface-container": "#eeedf1",
                        "inverse-primary": "#adc8f5",
                        "on-surface": "#1a1c1e",
                        "background": "#faf9fc",
                        "primary-container": "#1e3a5f",
                        "on-primary-container": "#8aa4cf",
                        "error-container": "#ffdad6",
                        "surface-bright": "#faf9fc",
                        "on-tertiary-fixed": "#291800",
                        "tertiary-fixed": "#ffddb2",
                        "primary": "#022448",
                        "on-primary-fixed": "#001c3b",
                        "on-primary-fixed-variant": "#2d486d",
                        "inverse-surface": "#2f3033",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f4f3f7",
                        "secondary-fixed-dim": "#a0caff",
                        "inverse-on-surface": "#f1f0f4",
                        "surface": "#faf9fc",
                        "primary-fixed-dim": "#adc8f5",
                        "on-tertiary-fixed-variant": "#60410c",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#c69b5f",
                        "tertiary": "#341f00",
                        "on-secondary-container": "#004375",
                        "tertiary-container": "#503300",
                        "on-background": "#1a1c1e",
                        "surface-container-highest": "#e3e2e6",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e9e7eb",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d2e4ff",
                        "secondary": "#0061a5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "md": "16px",
                        "gutter-mobile": "12px",
                        "xl": "32px",
                        "xs": "4px",
                        "lg": "24px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="bg-surface-container-low dark:bg-surface-dim shadow-sm flex justify-between items-center w-full px-margin-mobile h-16 z-50 docked full-width top-0 sticky">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">location_on</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">WorkConnect</span>
</div>
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-on-surface-variant dark:text-outline-variant hover:bg-surface-variant dark:hover:bg-on-surface-variant transition-colors p-2 rounded-full">notifications</button>
</div>
</header>
<main class="flex-grow flex flex-col px-margin-mobile py-lg max-w-2xl mx-auto w-full">
<!-- Progress Indicator -->
<div class="mb-lg">
<div class="flex justify-between items-center mb-sm">
<span class="font-label-lg text-label-lg text-primary uppercase tracking-wider">Step 2 of 4</span>
<span class="font-label-lg text-label-lg text-outline">50% Complete</span>
</div>
<div class="w-full bg-surface-container-highest rounded-full h-2 overflow-hidden">
<div class="bg-primary h-full rounded-full transition-all duration-500" style="width: 50%;"></div>
</div>
</div>
<!-- Header Content -->
<div class="mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">What work do you do?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Help us match you with the right employers by detailing your expertise.</p>
</div>
<!-- Onboarding Form -->
<form class="flex flex-col gap-lg">
<!-- Category Selection -->
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="work-category">Primary Profession</label>
<div class="relative">
<select class="w-full appearance-none bg-surface border border-outline-variant rounded-lg px-md py-4 font-body-lg text-body-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="work-category">
<option value="">Select your profession</option>
<option value="electrician">Electrician</option>
<option value="plumber">Plumber</option>
<option value="carpenter">Carpenter</option>
<option value="painter">Painter</option>
<option value="mason">Mason</option>
<option value="hvac">HVAC Technician</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<!-- Sub-Categories (Bento-style Grid) -->
<div class="space-y-md">
<label class="font-label-lg text-label-lg text-on-surface">Sub-categories / Specializations</label>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-sm">
<label class="flex items-center gap-md p-md border border-outline-variant rounded-xl bg-surface-container-lowest hover:bg-surface-container-low transition-all cursor-pointer group">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface">House Wiring</span>
</label>
<label class="flex items-center gap-md p-md border border-outline-variant rounded-xl bg-surface-container-lowest hover:bg-surface-container-low transition-all cursor-pointer group">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface">Industrial Maintenance</span>
</label>
<label class="flex items-center gap-md p-md border border-outline-variant rounded-xl bg-surface-container-lowest hover:bg-surface-container-low transition-all cursor-pointer group">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface">Appliance Repair</span>
</label>
<label class="flex items-center gap-md p-md border border-outline-variant rounded-xl bg-surface-container-lowest hover:bg-surface-container-low transition-all cursor-pointer group">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface">AC Installation</span>
</label>
</div>
</div>
<!-- Experience & Rates -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="experience">Experience (Years)</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-md py-4 font-body-lg text-body-lg focus:ring-2 focus:ring-primary focus:border-primary" id="experience" placeholder="e.g. 5" type="number"/>
</div>
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="daily-rate">Daily Rate (₹)</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 text-outline font-body-lg">₹</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-xl pr-md py-4 font-body-lg text-body-lg focus:ring-2 focus:ring-primary focus:border-primary" id="daily-rate" placeholder="800" type="number"/>
</div>
</div>
</div>
<!-- Optional Hourly Rate & Description -->
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="hourly-rate">Hourly Rate (Optional)</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 text-outline font-body-lg">₹</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-xl pr-md py-4 font-body-lg text-body-lg focus:ring-2 focus:ring-primary focus:border-primary" id="hourly-rate" placeholder="150" type="number"/>
</div>
</div>
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="description">Work Description</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg px-md py-4 font-body-lg text-body-lg focus:ring-2 focus:ring-primary focus:border-primary resize-none" id="description" placeholder="Briefly describe your work experience and major projects..." rows="4"></textarea>
</div>
<!-- Languages (Horizontal Pills) -->
<div class="space-y-sm">
<label class="font-label-lg text-label-lg text-on-surface">Languages you speak</label>
<div class="flex flex-wrap gap-sm">
<label class="relative cursor-pointer">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="px-lg py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary transition-all">Hindi</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-lg py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary transition-all">English</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-lg py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary transition-all">Bengali</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-lg py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary transition-all">Tamil</div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-lg py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary transition-all">Telugu</div>
</label>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-md mt-xl pb-24">
<button class="flex-1 py-4 px-md border border-primary text-primary font-label-lg text-label-lg rounded-xl hover:bg-surface-container-low active:scale-95 transition-all" type="button">Back</button>
<button class="flex-[2] py-4 px-md bg-[#FF6B35] text-white font-label-lg text-label-lg rounded-xl shadow-lg hover:shadow-xl active:scale-95 transition-all" type="submit">Next Step</button>
</div>
</form>
</main>
<!-- Bottom Navigation Mockup (Filtered - Hidden as this is a task-focused sub-page) -->
<!-- Applying "Shell Visibility & Relevance" mandate to hide BottomNavBar for Onboarding tasks -->
</body></html>
