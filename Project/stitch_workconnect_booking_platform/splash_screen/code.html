<style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    .splash-gradient {
      background: linear-gradient(180deg, #1E3A5F 0%, #4A90D9 100%);
    }
    .loader-ring {
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top: 3px solid #ffffff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background">
<!-- Splash Screen Container -->
<main class="relative h-screen w-full flex flex-col items-center justify-between splash-gradient overflow-hidden">
<!-- Abstract Background Elements for High-Fidelity Feel -->
<div class="absolute inset-0 opacity-10 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-72 h-72 rounded-full bg-white blur-3xl"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-96 h-96 rounded-full bg-white blur-3xl"></div>
</div>
<!-- Top Spacer for Layout Balance -->
<div class="flex-1"></div>
<!-- Center Content: Logo & Branding -->
<div class="flex flex-col items-center gap-lg z-10 px-margin-mobile">
<!-- App Logo Circle -->
<div class="relative flex items-center justify-center w-24 h-24 bg-white/10 backdrop-blur-md rounded-full shadow-2xl border border-white/20">
<div class="flex items-center justify-center w-20 h-20 bg-white rounded-full shadow-inner">
<span class="material-symbols-outlined text-primary text-[48px]" data-icon="handshake" style="font-variation-settings: 'FILL' 1;">
            handshake
          </span>
</div>
</div>
<!-- Text Group -->
<div class="text-center space-y-xs">
<h1 class="font-headline-lg text-on-primary tracking-tight leading-none" style="font-size: 28px;">
          WorkConnect
        </h1>
<p class="font-body-md text-white/80" style="font-size: 14px;">
          Find Skilled Workers Near You
        </p>
</div>
</div>
<!-- Bottom Section: Loading & Affirmation -->
<div class="flex-1 flex flex-col items-center justify-end pb-xl gap-md z-10">
<!-- Loading Indicator -->
<div class="flex flex-col items-center gap-sm">
<div class="loader-ring"></div>
<span class="font-label-md text-white/60 tracking-widest">LOADING</span>
</div>
<!-- Trust Badging / Versioning (Subtle) -->
<div class="pt-xl opacity-40">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-white text-[16px]" data-icon="verified_user">verified_user</span>
<span class="font-label-md text-white">SECURE CONNECTION</span>
</div>
</div>
</div>
<!-- Visual Texture Overlay -->
<div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-[0.03] pointer-events-none"></div>
</main>
