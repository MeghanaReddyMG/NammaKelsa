<!DOCTYPE html>

<style>
        .otp-input {
            width: 48px;
            height: 48px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Top Navigation Bar (Simplified for Task focus) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 z-50 bg-surface">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<div class="flex items-center justify-center bg-surface-container-low w-10 h-10 rounded-full">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow flex flex-col items-center px-margin-mobile pt-xl">
<!-- Content Canvas -->
<div class="w-full max-w-md flex flex-col">
<!-- Hero Illustration/Visual Anchor -->
<div class="mb-lg flex justify-center">
<div class="relative w-24 h-24 bg-primary-fixed rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<div class="absolute -right-2 -top-2 w-8 h-8 bg-secondary-container rounded-full border-4 border-background flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container text-sm">check</span>
</div>
</div>
</div>
<!-- Headlines -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Verify your phone</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant px-4">
                    Enter the 6-digit code sent to <span class="text-on-surface font-semibold">+91 XXXXX XXXXX</span>
</p>
</div>
<!-- OTP Input Section (Bento Card Style) -->
<div class="bg-surface-container-lowest p-lg rounded-xl shadow-sm border border-outline-variant mb-lg">
<div class="flex justify-between gap-2 mb-lg">
<input autofocus="" class="otp-input border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg bg-surface transition-all outline-none" maxlength="1" type="text"/>
<input class="otp-input border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg bg-surface transition-all outline-none" maxlength="1" type="text"/>
<input class="otp-input border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg bg-surface transition-all outline-none" maxlength="1" type="text"/>
<input class="otp-input border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg bg-surface transition-all outline-none" maxlength="1" type="text"/>
<input class="otp-input border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg bg-surface transition-all outline-none" maxlength="1" type="text"/>
<input class="otp-input border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-lg bg-surface transition-all outline-none" maxlength="1" type="text"/>
</div>
<!-- Resend Logic -->
<div class="flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-body-md">schedule</span>
<p class="font-label-lg text-label-lg text-on-surface-variant">
                        Resend code in <span class="text-secondary font-bold">00:30</span>
</p>
</div>
<!-- Hidden by default until timer expires (simulated transition state) -->
<div class="hidden flex justify-center mt-sm">
<button class="text-secondary font-label-lg text-label-lg hover:underline underline-offset-4 decoration-2">
                        Didn't receive code? Resend
                    </button>
</div>
</div>
<!-- Enterprise/Corporate Disclaimer -->
<div class="flex items-start gap-sm mb-xl p-md bg-surface-container-low rounded-lg">
<span class="material-symbols-outlined text-primary text-body-md mt-0.5">info</span>
<p class="font-body-md text-body-md text-on-surface-variant">
                    WorkConnect uses two-factor authentication to secure your professional profile and earnings data.
                </p>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-label-lg text-label-lg shadow-md hover:bg-primary-container hover:text-on-primary-container transition-all active:scale-[0.98] duration-100 flex items-center justify-center gap-2 mb-md">
                Verify
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Tertiary Action -->
<button class="w-full border border-primary text-primary py-3.5 rounded-xl font-label-lg text-label-lg hover:bg-surface-variant transition-all flex items-center justify-center gap-2">
                Edit Phone Number
            </button>
</div>
</main>
<!-- Decorative Bottom Canvas -->
<div class="mt-auto opacity-50 overflow-hidden pointer-events-none select-none">
<div class="h-32 w-full flex items-end justify-center">
<div class="grid grid-cols-6 gap-4 w-full px-margin-mobile">
<div class="h-16 bg-surface-container-high rounded-t-lg"></div>
<div class="h-24 bg-surface-container-high rounded-t-lg"></div>
<div class="h-12 bg-surface-container-high rounded-t-lg"></div>
<div class="h-28 bg-surface-container-high rounded-t-lg"></div>
<div class="h-20 bg-surface-container-high rounded-t-lg"></div>
<div class="h-14 bg-surface-container-high rounded-t-lg"></div>
</div>
</div>
</div>
